spring:
  config:
    activate:
      on-profile: security

  security:
    oauth2:
      client:
        registration:
          kakao:
            provider: kakao
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "https://{baseHost}{basePort}{basePath}/login/oauth2/code/{registrationId}"
            scope: profile_image, account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  issuer: ${SECURITY_JWT_ISSUER:}
  access-token-secret: ${SECURITY_JWT_ACCESS_TOKEN_SECRET:}
  access-token-expiration: ${SECURITY_JWT_ACCESS_TOKEN_EXPIRATION:7200}
  refresh-token-secret: ${SECURITY_JWT_REFRESH_TOKEN_SECRET:}
  refresh-token-expiration: ${SECURITY_JWT_REFRESH_TOKEN_EXPIRATION:259200}

basic-auth:
  username: ${SECURITY_BASIC_AUTH_USERNAME:default}
  password: ${SECURITY_BASIC_AUTH_PASSWORD:default}
